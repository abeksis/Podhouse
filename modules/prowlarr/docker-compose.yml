# Prowlarr — a Podhouse module
#
# Prowlarr — one list of indexers for every *arr app.
#
# Until 0.10.9 this app came only inside the Media Stack (modules/media). It is
# its own module now so it can be installed, updated and removed by itself;
# "Add the whole set" on the Apps page still installs all six in one go. A box
# that already runs the Media Stack keeps it — see `conflicts` below.

x-homebox:
  id: prowlarr
  added_at: "2026-09-18"
  title: "Prowlarr"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Prowlarr is an indexer manager/proxy built on the popular *arr .net/reactjs base stack to integrate with your various PVR apps, supporting management of both Torrent Trackers and Usenet Indexers."
  description: "Prowlarr is an indexer manager/proxy built on the popular *arr .net/reactjs base stack to integrate with your various PVR apps. Prowlarr supports management of both Torrent Trackers and Usenet Indexers. It integrates seamlessly with Lidarr, Mylar3, Radarr, Readarr, and Sonarr offering complete management of your indexers with no per app Indexer setup required (we do it all)."
  source: "https://github.com/Prowlarr/Prowlarr"
  docs: "https://prowlarr.com"
  license: "GPL-3.0"
  icon: "prowlarr.svg"
  category: "media"
  required: false
  default: false
  # Measured on a running box (192.168.1.77, 2026-09-18), idle.
  ram: "~250MB"
  # Shown together as one set on the Apps page, with a button that queues all six.
  collection: "media"
  # The same containers under the old all-in-one module. Two copies of the
  # same container name cannot exist, so this one is not offered while that runs.
  conflicts:
    - media
  theme:
    emoji: "🔎"
    color: "#e5a00d"
    bg: "#e5a00d1f"
  tips:
    - "Set Prowlarr up first: add Radarr and Sonarr under Settings > Apps (http://radarr:7878, http://sonarr:8989) and it pushes every indexer into them, so you never paste the same tracker twice."
    - "For indexers behind Cloudflare, add FlareSolverr as a proxy at http://flaresolverr:8191."
  env_vars:
    PUID:
      label: "User ID for file ownership"
      type: "text"
      default: "1000"
      config_editable: true
    PGID:
      label: "Group ID for file ownership"
      type: "text"
      default: "1000"
      config_editable: true
  services:
    prowlarr:
      friendly_name: "Prowlarr"
      color: "#e5a00d"
      description: "Indexer manager for the *arr apps"
      icon: "prowlarr.svg"
      port_map: 9696
      reset_login: "arr-config"
      url_scheme: "http"

services:

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls158
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Starts as root, takes ownership of its data directory and drops to its
      # own user. Without these five it either dies on chown or stays root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "9696:9696"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/prowlarr/config/prowlarr:/config
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
