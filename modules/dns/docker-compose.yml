# DNS — a Podhouse module
#
# AdGuard Home: network-wide ad blocking, and the DNS that makes the
# *.home addresses in this install resolve.

x-homebox:
  id: dns
  added_at: "2026-09-05"
  title: "AdGuard Home"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Network-wide ads & trackers blocking DNS server"
  description: "AdGuard Home is a network-wide software for blocking ads and tracking. After you set it up, it'll cover ALL your home devices, and you don't need any client-side software for that."
  source: "https://github.com/AdguardTeam/AdGuardHome"
  docs: "https://adguard.com/adguard-home/overview.html"
  license: "GPL-3.0"
  icon: "adguard-home.png"
  category: "network"
  required: false
  default: true
  ram: "~120MB"
  theme:
    emoji: "🛡️"
    color: "#67b279"
    bg: "rgba(103,178,121,0.12)"
  tips:
    - "Port 53 must be free first. On Debian check `ss -lntup | grep :53` — if systemd-resolved holds it, set DNSStubListener=no in /etc/systemd/resolved.conf and restart it"
    - "Setup wizard runs on 3054 the first time, then the UI lives on 3053"
    - "Add a DNS rewrite for *.home pointing at this box and every Podhouse address resolves house-wide"
  services:
    adguard:
      friendly_name: "AdGuard Home"
      color: "#67b279"
      description: "DNS filtering and ad blocking"
      icon: "adguard-home.png"
      port_map: 3053
      container_port: 80
      url_scheme: "http"
      first_login: "The first visit runs a setup wizard on port 3054 where you create the admin account."

services:
  adguard:
    image: adguard/adguardhome:v0.107.79
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
      # The AdGuardHome binary carries file capabilities, and exec of such a
      # file fails outright when they are outside the container's bounding set:
      # "exec /opt/adguardhome/AdGuardHome: operation not permitted", before a
      # single line of its own logging. NET_RAW is for its DHCP server.
      - NET_BIND_SERVICE
      - NET_RAW
    container_name: adguard
    ports:
      # Bound to the LAN address rather than 0.0.0.0: systemd-resolved holds
      # 127.0.0.53:53 on a stock Debian, and a wildcard bind collides with it —
      # every install on such a box failed with "address already in use".
      # Pi-hole binds the same way for the same reason.
      - "${HB_HOST_ADDRESS:-0.0.0.0}:53:53/tcp"
      - "${HB_HOST_ADDRESS:-0.0.0.0}:53:53/udp"
      - "3054:3000/tcp"
      - "3053:80/tcp"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/dns/config/adguard/work:/opt/adguardhome/work
      - ${HB_ROOT:-/opt/podhouse}/modules/dns/config/adguard/conf:/opt/adguardhome/conf
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
