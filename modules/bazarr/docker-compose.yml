# Bazarr — a Podhouse module
#
# Bazarr — subtitles for what Radarr and Sonarr bring in.
#
# Until 0.10.9 this app came only inside the Media Stack (modules/media). It is
# its own module now, installed, updated and removed like any other app. A
# box that already runs the Media Stack keeps it — see `conflicts` below.

x-homebox:
  id: bazarr
  added_at: "2026-09-18"
  title: "Bazarr"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Bazarr is a companion application to Sonarr and Radarr. It manages and downloads subtitles based on your requirements. You define your preferences by TV show or movie and Bazarr takes care of everything for you."
  description: "A companion application to Sonarr and Radarr that manages and downloads subtitles based on your requirements."
  source: "https://github.com/morpheus65535/bazarr"
  docs: "https://www.bazarr.media"
  license: "GPL-3.0"
  icon: "bazarr.svg"
  category: "media"
  required: false
  default: false
  # Measured on a running box (192.168.1.77, 2026-09-18), idle.
  ram: "~260MB"
  # The same containers under the old all-in-one module. Two copies of the
  # same container name cannot exist, so this one is not offered while that runs.
  conflicts:
    - media
  theme:
    emoji: "💬"
    color: "#6b3fa0"
    bg: "#6b3fa01f"
  tips:
    - "Connect it to Radarr (http://radarr:7878) and Sonarr (http://sonarr:8989) with their API keys, from Settings in each."
  env_vars:
    PUID:
      label: "User ID for file ownership"
      type: "text"
      default: "1000"
      config_editable: true
    PGID:
      label: "Group ID for file ownership"
      type: "text"
      default: "1000"
      config_editable: true
  services:
    bazarr:
      friendly_name: "Bazarr"
      color: "#6b3fa0"
      description: "Subtitle downloader"
      icon: "bazarr.svg"
      port_map: 6767
      url_scheme: "http"

services:

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.0-ls362
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Starts as root, takes ownership of its data directory and drops to its
      # own user. Without these five it either dies on chown or stays root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "6767:6767"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/bazarr/config/bazarr:/config
      # One mount, for the hardlink reason above.
      - ${HB_MEDIA_ROOT:-${HB_DATA_DIR:-${HB_ROOT:-/opt/podhouse}/data}}:/data
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
