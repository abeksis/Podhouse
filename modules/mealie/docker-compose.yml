# Mealie — a Podhouse module
#
# Recipes, meal plans, and a shopping list that builds itself.

x-homebox:
  id: mealie
  added_at: "2026-09-09"
  title: "Mealie"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Mealie is a self hosted recipe manager and meal planner with a RestAPI backend and a reactive frontend application built in Vue for a pleasant user experience for the whole family. Easily add recipes into your database by providing the url and mealie will automatically import the relevant data or add a family recipe with the UI editor"
  description: "Mealie is a self hosted recipe manager, meal planner and shopping list with a RestAPI backend and a reactive frontend built in Vue for a pleasant user experience for the whole family. Easily add recipes into your database by providing the URL and Mealie will automatically import the relevant data, or add a family recipe with the UI editor. Mealie also provides an API for interactions from 3rd party applications."
  source: "https://github.com/mealie-recipes/mealie"
  docs: "https://docs.mealie.io"
  license: "AGPL-3.0"
  icon: "mealie.svg"
  category: "productivity"
  required: false
  default: false
  ram: "~400MB"
  theme:
    emoji: "🍲"
    color: "#e58325"
    bg: "rgba(229,131,37,0.12)"
  tips:
    - "The first account you create on the first visit becomes the admin"
    - "Import by URL works on most recipe sites; when it does not, the manual editor takes a paste of the ingredient list and splits it for you"
    - "BASE_URL has to match the address you use, or the share links it generates point somewhere unreachable"
  env_vars:
    MEALIE_URL:
      label: "Public URL"
      type: "text"
  services:
    mealie:
      friendly_name: "Mealie"
      color: "#e58325"
      description: "Keeps your recipes and plans the week's meals"
      icon: "mealie.svg"
      port_map: 9925
      container_port: 9000
      url_scheme: "http"
      first_login: "The first account you create becomes the admin."

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.20.1
    container_name: mealie
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - ALLOW_SIGNUP=false
      - BASE_URL=${MEALIE_URL:-http://${HB_HOST_ADDRESS:-localhost}:9925}
      # SQLite by default, which is the right call for a household: one file
      # to back up, and nothing here is write-heavy enough to need Postgres.
      - DB_ENGINE=sqlite
    ports:
      - "9925:9000"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/mealie/config/mealie:/app/data
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.00'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Starts as root, takes ownership of its data directory and drops to its
      # own user. Without these five it either dies on chown or stays root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
