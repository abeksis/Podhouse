# qBittorrent — a Podhouse module
#
# qBittorrent — the download client the *arr apps hand their finds to.
#
# Until 0.10.9 this app came only inside the Media Stack (modules/media). It is
# its own module now so it can be installed, updated and removed by itself;
# "Add the whole set" on the Apps page still installs all six in one go. A box
# that already runs the Media Stack keeps it — see `conflicts` below.

x-homebox:
  id: qbittorrent
  added_at: "2026-09-18"
  title: "qBittorrent"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "qBittorrent BitTorrent client"
  description: "qBittorrent is a BitTorrent client programmed in C++ / Qt that uses libtorrent (sometimes called libtorrent-rasterbar) by Arvid Norberg."
  source: "https://github.com/qbittorrent/qBittorrent"
  docs: "https://www.qbittorrent.org"
  icon: "qbittorrent.svg"
  category: "media"
  required: false
  default: false
  # Measured on a running box (192.168.1.77, 2026-09-18), idle.
  ram: "~550MB"
  # Shown together as one set on the Apps page, with a button that queues all six.
  collection: "media"
  # The same containers under the old all-in-one module. Two copies of the
  # same container name cannot exist, so this one is not offered while that runs.
  conflicts:
    - media
  theme:
    emoji: "⬇️"
    color: "#2f67ba"
    bg: "#2f67ba1f"
  tips:
    - "Set the save path to /data/<Downloads>, using the folder name from Settings > Configuration > Media (by default /data/downloads)."
    - "Every one of these apps mounts the pool at the same path (/data), which is what lets downloads become hardlinks instead of copies. Change one mapping and your disk usage quietly doubles."
  env_vars:
    PUID:
      label: "User ID for file ownership"
      type: "text"
      default: "1000"
      config_editable: true
    PGID:
      label: "Group ID for file ownership"
      type: "text"
      default: "1000"
      config_editable: true
    HB_QBIT_USER:
      label: "qBittorrent web UI username"
      type: "text"
      default: "admin"
      config_editable: true
    HB_QBIT_PASS:
      label: "qBittorrent web UI password"
      type: "secret"
      config_editable: true
  services:
    qbittorrent:
      friendly_name: "qBittorrent"
      color: "#2f67ba"
      description: "BitTorrent client"
      icon: "qbittorrent.svg"
      port_map: 8080
      first_login: "qBittorrent's web UI account. Podhouse writes it into qBittorrent's own config before first start, so it survives restarts — left to itself qBittorrent invents a new temporary password every time it boots."
      reset_login: "qbittorrent"
      url_scheme: "http"

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls475
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Starts as root, takes ownership of its data directory and drops to its
      # own user. Without these five it either dies on chown or stays root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=28745
    ports:
      - "8080:8080"
      - "28745:28745/tcp"
      - "28745:28745/udp"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/qbittorrent/config/qbittorrent:/config
      # ONE mount for the whole pool, and it has to stay one.
      #
      # Binding downloads and the library separately makes them two vfsmounts,
      # and do_linkat() compares the MOUNT, not the filesystem - so a hardlink
      # between them fails with EXDEV even when both sides are the same disk,
      # and every import silently becomes a full copy. Measured here: linking
      # /data/downloads to /data/media/tv across two binds gave EXDEV, while
      # the identical link on the host, where it is one mount, succeeded.
      #
      # So the HOST side is a single root and the categories are names inside
      # it. Compose has no conditionals, which is the other reason: there is
      # no way to express "bind these three only if they share a parent".
      - ${HB_MEDIA_ROOT:-${HB_DATA_DIR:-${HB_ROOT:-/opt/podhouse}/data}}:/data
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
