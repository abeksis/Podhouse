# Sonarr — a Podhouse module
#
# Sonarr — TV series: follow them, fetch them, keep them named.
#
# Until 0.10.9 this app came only inside the Media Stack (modules/media). It is
# its own module now so it can be installed, updated and removed by itself;
# "Add the whole set" on the Apps page still installs all six in one go. A box
# that already runs the Media Stack keeps it — see `conflicts` below.

x-homebox:
  id: sonarr
  added_at: "2026-09-18"
  title: "Sonarr"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Smart PVR for newsgroup and bittorrent users."
  description: "Sonarr is a PVR for Usenet and BitTorrent users. It can monitor multiple RSS feeds for new episodes of your favorite shows and will grab, sort and rename them. It can also be configured to automatically upgrade the quality of files already downloaded when a better quality format becomes available."
  source: "https://github.com/Sonarr/Sonarr"
  docs: "https://sonarr.tv"
  license: "GPL-3.0"
  icon: "sonarr.png"
  category: "media"
  required: false
  default: false
  # Measured on a running box (192.168.1.77, 2026-09-18), idle.
  ram: "~260MB"
  # Shown together as one set on the Apps page, with a button that queues all six.
  collection: "media"
  # The same containers under the old all-in-one module. Two copies of the
  # same container name cannot exist, so this one is not offered while that runs.
  conflicts:
    - media
  theme:
    emoji: "📺"
    color: "#35c5f4"
    bg: "#35c5f41f"
  backup:
    # Posters Sonarr downloads again by itself, and its logs.
    exclude:
      - sonarr/MediaCover
      - sonarr/logs
  tips:
    - "In Sonarr set the root folder to /data/<TV series>, using the folder name from Settings > Configuration > Media (by default /data/media/tv)."
    - "Add qBittorrent as its download client at http://qbittorrent:8080, and let Prowlarr push the indexers in."
    - "Every one of these apps mounts the pool at the same path (/data), which is what lets downloads become hardlinks instead of copies. Change one mapping and your disk usage quietly doubles."
  env_vars:
    PUID:
      label: "User ID for file ownership"
      type: "text"
      default: "1000"
      config_editable: true
    PGID:
      label: "Group ID for file ownership"
      type: "text"
      default: "1000"
      config_editable: true
  services:
    sonarr:
      friendly_name: "Sonarr"
      color: "#35c5f4"
      description: "TV series collection manager"
      icon: "sonarr.png"
      port_map: 8989
      reset_login: "arr-config"
      url_scheme: "http"

services:

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls323
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Starts as root, takes ownership of its data directory and drops to its
      # own user. Without these five it either dies on chown or stays root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "8989:8989"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/sonarr/config/sonarr:/config
      # One mount, for the hardlink reason above.
      - ${HB_MEDIA_ROOT:-${HB_DATA_DIR:-${HB_ROOT:-/opt/podhouse}/data}}:/data
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
