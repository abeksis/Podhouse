# Core — a Podhouse module
#
# Nginx Proxy Manager: the reverse proxy that routes your domain to the right
# service. Always active.
#
# Portainer used to be here too and is now its own module — see the comment
# above its (legacy, profiled) definition below.

x-homebox:
  id: core
  added_at: "2026-09-05"
  title: "Core Infrastructure"
  tagline: "What every other app stands on"
  description: "A reverse proxy that routes a domain to the right app and gets free SSL certificates for it. Every other module assumes it is here."
  icon: "nginx-proxy-manager.svg"
  category: "system"
  required: true
  default: true
  ram: "~350MB"
  theme:
    emoji: "🏗️"
    color: "#1f8fd6"
    bg: "rgba(31,143,214,0.12)"
  tips:
    - "Nginx Proxy Manager's own admin UI is on port 81. That port is how someone takes over your proxy — do not expose it beyond the LAN"
    - "The NPM admin account is seeded at first boot from the generated password; `homebox secrets core` prints it"
    - "Portainer used to live here and is now its own app in the store — a box that already had it keeps it, and it still holds a read-write Docker socket, so: LAN only"
  env_vars:
    NPM_ADMIN_PASSWORD:
      label: "Proxy manager admin password"
      type: "secret"
      config_editable: false
    PORTAINER_ADMIN_PASSWORD:
      label: "Portainer admin password"
      type: "secret"
      config_editable: false
  services:
    npm:
      friendly_name: "Proxy Manager"
      color: "#f15833"
      description: "Reverse proxy, domains and SSL certificates"
      icon: "nginx-proxy-manager.svg"
      port_map: 81
      container_port: 81
      url_scheme: "http"
      first_login: "The proxy admin account, seeded at first boot. Change the password inside Nginx Proxy Manager afterwards if you like — Podhouse does not need it again."
    portainer:
      friendly_name: "Portainer"
      color: "#13bef9"
      description: "Full Docker management UI"
      icon: "portainer.svg"
      port_map: 9000
      url_scheme: "http"
      first_login: "Portainer's admin account, seeded from .env at first start."

services:
  npm:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: npm
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # The admin UI. Whoever reaches this owns every route on the box.
      - "81:81"
    environment:
      - TZ=${TZ:-UTC}
      - INITIAL_ADMIN_EMAIL=${NPM_ADMIN_EMAIL:-admin@homebox.local}
      - INITIAL_ADMIN_PASSWORD=${NPM_ADMIN_PASSWORD:-}
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/core/config/npm/data:/data
      - ${HB_ROOT:-/opt/podhouse}/modules/core/config/npm/letsencrypt:/etc/letsencrypt
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The proxy is the one module that MUST come up, and it does two
      # privileged-looking things on first boot: it creates its own user
      # (useradd writes /etc/shadow) and it listens on 80 and 443. With a
      # bare cap_drop it failed both, s6 gave up on the service, and the box
      # had no proxy and no dashboard behind it.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  # LEGACY, and left here on purpose.
  #
  # Portainer was part of core until 0.9.0, so every box installed before then
  # is running this container. It is a second read-write Docker socket on the
  # box — root, in effect — and most people never open it, so new boxes do not
  # get it: it is a module of its own in the store now (modules/portainer).
  #
  # The profile is what makes both true at once. Compose does not start a
  # service in a profile that is not asked for, and it does not treat the
  # container of one as an orphan either — so a box that has Portainer keeps it
  # running across every update, and a box that does not, never creates it.
  # Removing these lines instead would DELETE a working Portainer, with its
  # settings, on the next `compose up --remove-orphans`.
  portainer:
    profiles: ["legacy"]
    image: portainer/portainer-ce:2.45.0
    # Seeding the admin password from a file means the setup screen is never
    # left open for whoever reaches the box first.
    command: ["--admin-password-file", "/run/secrets/portainer_admin_password"]
    container_name: portainer
    ports:
      - "${PORTAINER_PORT:-9000}:9000"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HB_ROOT:-/opt/podhouse}/modules/core/config/portainer:/data
      - ${HB_ROOT:-/opt/podhouse}/modules/core/config/portainer-admin-password:/run/secrets/portainer_admin_password:ro
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
    # No healthcheck: the image is distroless, with no shell and no HTTP
    # client to run a probe with.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
