# Budget — a Podhouse module
#
# Actual: envelope budgeting, with the ledger on your own disk.

x-homebox:
  id: budget
  added_at: "2026-09-09"
  title: "Actual Budget"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "A local-first personal finance app"
  description: "Actual is a local-first personal finance tool. It is 100% free and open-source, written in NodeJS, it has a synchronization element so that all your changes can move between devices without any heavy lifting."
  source: "https://github.com/actualbudget/actual"
  docs: "https://actualbudget.org"
  license: "MIT"
  icon: "actual-budget.webp"
  category: "productivity"
  required: false
  default: false
  ram: "~200MB"
  theme:
    emoji: "💰"
    color: "#6b46c1"
    bg: "rgba(107,70,193,0.12)"
  tips:
    - "The first visit sets the server password. The budget file itself is encrypted with a separate passphrase you choose — lose that one and the file is unreadable, including to you"
    - "Bank sync goes through GoCardless or SimpleFIN and needs an account with them; without it, import a QFX or CSV from the bank"
    - "This holds your complete financial history. It is the module where a tested restore matters, not just a backup"
  services:
    budget:
      friendly_name: "Actual Budget"
      color: "#6b46c1"
      description: "Envelope budgeting"
      icon: "actual-budget.webp"
      port_map: 5006
      url_scheme: "http"
      first_login: "The first visit asks you to set the server password."

services:
  budget:
    image: actualbudget/actual-server:26.7.0
    container_name: budget
    environment:
      - TZ=${TZ:-UTC}
      - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=100
    ports:
      - "5006:5006"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/budget/config/actual:/data
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
