# Seerr — a Podhouse module
#
# Requests for films and shows, connected to the media server and the *arr apps.

x-homebox:
  id: seerr
  added_at: "2026-09-25"
  title: "Seerr"
  tagline: "Manage requests for your media library"
  description: "Seerr is a free and open source application for managing requests for a Jellyfin, Plex or Emby media library. It connects to Sonarr and Radarr so approved films and shows can be collected automatically."
  source: "https://github.com/seerr-team/seerr"
  docs: "https://docs.seerr.dev"
  license: "MIT"
  icon: "seerr.svg"
  category: "media"
  required: false
  default: false
  ram: "~350MB"
  theme:
    emoji: "🎟️"
    color: "#6366f1"
    bg: "rgba(99,102,241,0.12)"
  backup:
    exclude:
      - seerr/logs
  tips:
    - "With Jellyfin installed, Podhouse finishes Seerr's setup for you: sign in with the Jellyfin admin account, and requests go to Radarr and Sonarr."
    - "Family members sign in with their own Jellyfin accounts; give them one in Jellyfin first."
  services:
    seerr:
      friendly_name: "Seerr"
      color: "#6366f1"
      description: "Media request manager"
      icon: "seerr.svg"
      port_map: 5055
      url_scheme: "http"
      first_login: "With Jellyfin installed, sign in with the Jellyfin admin username and password from Settings > Passwords. Without it, the first visit opens the setup wizard."

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    init: true
    container_name: seerr
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=info
      - PORT=5055
    ports:
      - "5055:5055"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/seerr/config/seerr:/app/config
    networks:
      - homebox_proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      start_period: 20s
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.50'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
