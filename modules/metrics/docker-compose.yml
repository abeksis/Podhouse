# Metrics — a Podhouse module
#
# Beszel: what every machine is actually doing, on one page.

x-homebox:
  id: metrics
  added_at: "2026-09-09"
  title: "Beszel"
  # The project's own words rather than ours, like every module that has a
  # single upstream (scripts/upstream-meta.js). Written by hand here: the
  # description is longer than the first paragraph that script would take.
  tagline: "Lightweight server monitoring with historical data, docker stats, and alerts."
  description: "Beszel is a lightweight server monitoring platform that includes Docker statistics, historical data, and alert functions. It has a friendly web interface, simple configuration, and is ready to use out of the box. It supports automatic backup, multi-user, OAuth authentication, and API access."
  source: "https://github.com/henrygd/beszel"
  # How to use the app is the project's to explain, and they keep it current.
  docs: "https://beszel.dev/guide/getting-started"
  license: "MIT"
  icon: "beszel.svg"
  category: "system"
  required: false
  default: false
  # Measured, not estimated: hub 44MB + agent 14MB on a running box
  # (192.168.1.77, 2026-09-18). The Docker filter adds a few MB more.
  ram: "~60MB"
  theme:
    emoji: "📈"
    color: "#5b8def"
    bg: "rgba(91,141,239,0.12)"
  # Only what Podhouse does differently, as steps. Using Beszel itself is in
  # `docs` above. The agent's key is NOT a step any more: setup.sh reads it
  # from the hub's own key file, and an older note here told people to copy
  # it by hand.
  tips:
    - "On the first visit, Beszel asks you to create its admin account."
    - "To see this box, choose Add System in Beszel and enter this box's address (shown at the top of this page) with port 45876. Not localhost — Beszel runs in a container, where localhost is the container. Ignore the key it shows: Podhouse has already given it to the agent."
  env_vars:
    BESZEL_AGENT_KEY:
      label: "Hub public key for the agent"
      type: "secret"
      # The hub issues this on its first start. Generating 24 random bytes
      # here would just be an agent that cannot authenticate.
      generated: false
  services:
    beszel:
      friendly_name: "Beszel"
      color: "#5b8def"
      description: "Metrics hub"
      icon: "beszel.svg"
      port_map: 8090
      url_scheme: "http"
      first_login: "Beszel creates its admin account on the first visit — pick an email and password there."
    beszel-agent:
      friendly_name: "Beszel Agent"
      description: "Reports this box's metrics"
      icon: "beszel.svg"
      # Listens on the host at 45876 for the hub, and has no page of its own.
      internal: true
    metrics-socket:
      friendly_name: "Docker filter"
      description: "Answers the agent's read-only questions about containers"
      internal: true

services:
  beszel:
    image: henrygd/beszel:0.19.0
    container_name: beszel
    ports:
      - "8090:8090"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      # PocketBase underneath, so this one directory IS the hub: systems,
      # history, alerts and the SSH key it authenticates agents with.
      - ${HB_ROOT:-/opt/podhouse}/modules/metrics/config/beszel:/beszel_data
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  beszel-agent:
    image: henrygd/beszel-agent:0.19.0
    container_name: beszel-agent
    # Host networking is the point of an agent: from inside a bridge network
    # it would report the container's CPU and the container's filesystem,
    # which is not what anyone installs this to see.
    network_mode: host
    environment:
      - TZ=${TZ:-UTC}
      - LISTEN=45876
      - KEY=${BESZEL_AGENT_KEY:-}
      # Not the socket itself. The agent only ever lists containers and reads
      # their stats, and a `:ro` mount on a socket restricts nothing — the
      # flag applies to the file, and every write goes through the API behind
      # it. This points it at a proxy that answers GETs about containers and
      # refuses everything else, so the graphs keep their names and this
      # container can no longer create anything. See docs/DOCKER-SOCKET.md.
      - DOCKER_HOST=tcp://127.0.0.1:2377
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  # A filter in front of the Docker socket, for the agent above.
  #
  # It answers /containers GETs and refuses every other path and every write
  # method, so the worst a compromised agent can do with it is read the names
  # and stats it was already reading. Published on loopback only, because the
  # agent runs with host networking and cannot reach a bridge network.
  metrics-socket:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: metrics-socket
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The proxy is haproxy: it drops to its own user and binds inside the
      # container, and it cannot do either without these.
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    environment:
      - CONTAINERS=1
      # Everything else stays off, including POST: this proxy can only read.
      - POST=0
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - EXEC=0
      - INFO=0
      - SERVICES=0
      - TASKS=0
      - SWARM=0
      - SYSTEM=0
    ports:
      - "127.0.0.1:2377:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
