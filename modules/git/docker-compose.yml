# Git — a Podhouse module
#
# Gitea: your own GitHub, SQLite-backed so it is one directory.

x-homebox:
  id: git
  added_at: "2026-09-05"
  title: "Gitea"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Git with a cup of tea! Painless self-hosted all-in-one software development service, including Git hosting, code review, team collaboration, package registry and CI/CD"
  description: "The goal of Gitea is to make the easiest, fastest, and most painless way of setting up a self-hosted all-in-one software development service, including Git hosting, code management, code review, issue tracking, project kanban, wiki, team collaboration, package registry and CI/CD which can reuse GitHub Actions."
  source: "https://github.com/go-gitea/gitea"
  docs: "https://gitea.com"
  license: "MIT"
  icon: "gitea.svg"
  category: "productivity"
  required: false
  default: false
  ram: "~200MB"
  theme:
    emoji: "🌱"
    color: "#5aa14a"
    bg: "rgba(90,161,74,0.12)"
  tips:
    - "The first account registered becomes the admin, so register yours before turning signups off in the install page"
    - "SSH is on 2222, not 22 — clone with ssh://git@<box>:2222/user/repo.git so it does not fight the box's own sshd"
    - "It runs on SQLite here. That is the right call for a handful of repos and one user; add Postgres only if you outgrow it"
  services:
    gitea:
      friendly_name: "Gitea"
      color: "#5aa14a"
      description: "Git hosting and code review"
      icon: "gitea.svg"
      port_map: 3030
      container_port: 3000
      url_scheme: "http"
      first_login: "The first visit shows an install page; the first user you register becomes the admin."

services:
  gitea:
    image: gitea/gitea:1.24.6
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Starts as root, takes ownership of its data directory and drops to its
      # own user. Without these five it either dies on chown or stays root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    container_name: gitea
    environment:
      - TZ=${TZ:-UTC}
      - USER_UID=${PUID:-1000}
      - USER_GID=${PGID:-1000}
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__SSH_LISTEN_PORT=22
    ports:
      - "3030:3000"
      - "2222:22"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/git/config/gitea:/data
      # Only /etc/localtime: on a systemd host /etc/timezone does not exist,
      # and bind-mounting a missing path makes Docker create a directory there.
      - /etc/localtime:/etc/localtime:ro
      # This image ships no zone database. With TZ set to a NAME, musl looks
      # the name up here and falls back to UTC when it is missing - ignoring
      # /etc/localtime entirely. Lending it the host copy fixes the clock
      # without patching an upstream image.
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
