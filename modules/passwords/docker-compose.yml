# Passwords — a Podhouse module
#
# Vaultwarden: a Bitwarden-compatible vault that never leaves this box.

x-homebox:
  id: passwords
  added_at: "2026-09-05"
  title: "Password Vault"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Unofficial Bitwarden compatible server written in Rust, formerly known as bitwarden_rs"
  description: "An alternative server implementation of the Bitwarden Client API, written in Rust and compatible with official Bitwarden clients disclaimer, perfect for self-hosted deployment where running the official resource-heavy service might not be ideal."
  source: "https://github.com/dani-garcia/vaultwarden"
  license: "AGPL-3.0"
  icon: "vaultwarden.svg"
  category: "security"
  required: false
  default: false
  ram: "~120MB"
  theme:
    emoji: "🔐"
    color: "#175ddc"
    bg: "rgba(23,93,220,0.12)"
  tips:
    - "This app CANNOT be used over http://<ip>:8222 — the vault encrypts in the browser via crypto.subtle, which browsers only expose over HTTPS or on localhost. Put it behind Proxy Manager with a certificate, or reach it through an SSH tunnel to localhost"
    - "Register your account, then set Allow new signups to false in Settings — otherwise anyone who reaches the page can create one"
    - "The official mobile apps refuse a self-signed certificate. For phone use this needs a real hostname with real TLS, not an IP"
    - "This is the one app where a tested restore matters more than a backup — the config directory IS the vault"
  env_vars:
    VAULTWARDEN_DOMAIN:
      label: "Public URL"
      # Declared so it is an editable field in Settings rather than a line
      # somebody has to know to add to .env by hand. No default: a wrong value
      # here is worse than an empty one, because Vaultwarden builds invite and
      # reset links from it and scopes WebAuthn to it.
      type: "text"
    VAULTWARDEN_SIGNUPS:
      label: "Allow new signups"
      type: "text"
      default: "true"
    VAULTWARDEN_ADMIN_TOKEN:
      label: "Admin panel token"
      type: "secret"
      config_editable: false
      dangerous: true
  services:
    vaultwarden:
      friendly_name: "Vaultwarden"
      color: "#175ddc"
      description: "Password manager server"
      icon: "vaultwarden.svg"
      port_map: 8222
      container_port: 80
      url_scheme: "http"
      first_login: "Create your account on the first visit, then turn signups off."

services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    environment:
      - TZ=${TZ:-UTC}
      # Open for the first account, then closed from Settings. It was hardcoded
      # true while the tip below told people to turn it off — which no amount
      # of reading the tip could accomplish.
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS:-true}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:-}
      # Set this once the vault is behind a proxy with a certificate, e.g.
      # https://vault.example.com. Vaultwarden builds invite and reset links
      # and scopes WebAuthn from it, so a wrong value breaks both silently.
      #
      # It must never arrive EMPTY. Vaultwarden validates DOMAIN as a URL the
      # moment it is present, and an empty string fails that check with
      # "relative URL without a base" — the container then crash-looped on
      # every fresh install, on the one app in this catalog where a box that
      # will not start is the worst outcome. The fallback is the address this
      # box already knows it answers on, which is where the vault actually is
      # until somebody puts a hostname in front of it.
      - DOMAIN=${VAULTWARDEN_DOMAIN:-http://${HB_HOST_ADDRESS:-localhost}:8222}
      - DATA_FOLDER=/data
      - ROCKET_PORT=80
    ports:
      - "8222:80"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/passwords/config/vaultwarden:/data
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
