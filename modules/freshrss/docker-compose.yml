# FreshRSS — a Podhouse module
#
# The feeds, without the algorithm.

x-homebox:
  id: freshrss
  added_at: "2026-09-09"
  title: "FreshRSS"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "A free, self-hostable news aggregator…"
  description: "FreshRSS is a self-hosted RSS feed aggregator. It is lightweight, easy to work with, powerful, customizable, and has been translated into many languages."
  source: "https://github.com/FreshRSS/FreshRSS"
  docs: "https://freshrss.org"
  license: "AGPL-3.0"
  icon: "freshrss.svg"
  category: "productivity"
  required: false
  default: false
  ram: "~150MB"
  theme:
    emoji: "📰"
    color: "#ff6600"
    bg: "rgba(255,102,0,0.12)"
  tips:
    - "The setup wizard on the first visit creates the admin account and picks the database — SQLite is the right answer for one person"
    - "Turn on the API under Settings then Authentication to use Reeder, FeedMe or NetNewsWire against it"
    - "It refreshes on a cron inside the container; a feed that looks stuck is usually the site's feed, not FreshRSS"
  services:
    freshrss:
      friendly_name: "FreshRSS"
      color: "#ff6600"
      description: "RSS and Atom reader"
      icon: "freshrss.svg"
      port_map: 8070
      container_port: 80
      url_scheme: "http"
      first_login: "A setup wizard on the first visit creates the admin account."

services:
  freshrss:
    image: freshrss/freshrss:1.29.1
    container_name: freshrss
    environment:
      - TZ=${TZ:-UTC}
      # Two odd minutes past the hour rather than on the hour: every feed
      # reader in the world fetches at :00, and some publishers rate-limit it.
      - CRON_MIN=13,43
    ports:
      - "8070:80"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/freshrss/config/data:/var/www/FreshRSS/data
      - ${HB_ROOT:-/opt/podhouse}/modules/freshrss/config/extensions:/var/www/FreshRSS/extensions
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Starts as root, takes ownership of its data directory and drops to its
      # own user. Without these five it either dies on chown or stays root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
