# Stirling PDF — a Podhouse module
#
# Every "free online PDF tool", without uploading anything.

x-homebox:
  id: stirling-pdf
  added_at: "2026-09-09"
  title: "Stirling PDF"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "1 PDF Application on GitHub that lets you edit PDFs on any device anywhere"
  description: "Stirling PDF is a powerful, open-source PDF editing platform. Run it as a personal desktop app, in the browser, or deploy it on your own servers with a private API. Edit, sign, redact, convert, and automate PDFs without sending documents to external services."
  source: "https://github.com/Stirling-Tools/Stirling-PDF"
  docs: "https://stirling.com"
  icon: "stirling-pdf.svg"
  category: "productivity"
  required: false
  default: false
  ram: "~800MB"
  theme:
    emoji: "📄"
    color: "#b71c1c"
    bg: "rgba(183,28,28,0.12)"
  tips:
    - "No login by default — anything that reaches the page can process files. Turn on security in Settings if this box is not only yours"
    - "OCR and Office conversion pull extra language and LibreOffice packs the first time you use them, so the first run of those is slow"
    - "Files are processed and handed back, not stored. There is no library to go and find something in later"
  services:
    stirling-pdf:
      friendly_name: "Stirling PDF"
      color: "#b71c1c"
      description: "PDF toolbox"
      icon: "stirling-pdf.svg"
      port_map: 8084
      container_port: 8080
      url_scheme: "http"
      first_login: "No account by default — it opens straight into the tool list."

services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:2.14.3
    container_name: stirling-pdf
    environment:
      - TZ=${TZ:-UTC}
      - DOCKER_ENABLE_SECURITY=false
      - LANGS=en_GB,he_IL
    ports:
      - "8084:8080"
    volumes:
      # OCR language data, which is what makes the first OCR run slow and
      # every one after it fast.
      - ${HB_ROOT:-/opt/podhouse}/modules/stirling-pdf/config/training:/usr/share/tessdata
      - ${HB_ROOT:-/opt/podhouse}/modules/stirling-pdf/config/configs:/configs
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.00'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Starts as root, takes ownership of its data directory and drops to its
      # own user. Without these five it either dies on chown or stays root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
