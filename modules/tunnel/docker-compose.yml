# Tunnel — a Podhouse module
#
# cloudflared: reach an app from outside without opening a port.

x-homebox:
  id: tunnel
  added_at: "2026-09-09"
  title: "Cloudflare Tunnel"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Cloudflare Tunnel client"
  description: "Contains the command-line client for Cloudflare Tunnel, a tunneling daemon that proxies traffic from the Cloudflare network to your origins. This daemon sits between Cloudflare network and your origin (e.g. a webserver). Cloudflare attracts client requests and sends them to you via this daemon, without requiring you to poke holes on your firewall --- your origin can remain as closed as possible."
  source: "https://github.com/cloudflare/cloudflared"
  docs: "https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel"
  license: "Apache-2.0"
  icon: "cloudflare.svg"
  category: "system"
  required: false
  default: false
  ram: "~40MB"
  theme:
    emoji: "☁️"
    color: "#f6821f"
    bg: "rgba(246,130,31,0.12)"
  tips:
    - "Create the tunnel at one.dash.cloudflare.com → Networks → Tunnels, then paste its token into Settings. The token IS the credential — anyone holding it can publish through your tunnel"
    - "Point a public hostname at the container name, not the LAN IP: http://vaultwarden:80, http://linkding:9090. cloudflared shares a docker network with them, so it resolves those by name"
    - "Anything you publish this way is reachable by the whole internet. Put Cloudflare Access in front of any app whose own login you would not want brute-forced"
    - "This is what makes Vaultwarden usable: its vault needs HTTPS to decrypt in the browser, and the tunnel gives it a real certificate at the edge"
  env_vars:
    CLOUDFLARE_TUNNEL_TOKEN:
      label: "Tunnel token"
      type: "secret"
      # Cloudflare issues this one. See the note in install.sh: a generated
      # placeholder here would just be a container that cannot authenticate.
      generated: false
      dangerous: true
  services:
    cloudflared:
      friendly_name: "Cloudflare Tunnel"
      color: "#f6821f"
      description: "Outbound tunnel to Cloudflare"
      icon: "cloudflare.svg"
      # No page of its own, and deliberately no published port: the whole
      # point is that this container only ever dials out.
      internal: true

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TZ=${TZ:-UTC}
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    # On homebox_proxy so a public hostname can point at http://<container>:<port>
    # and reach the app directly, without going back out to the LAN address.
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
