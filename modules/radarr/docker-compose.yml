# Radarr — a Podhouse module
#
# Radarr — films: follow them, fetch them, keep them named.
#
# Until 0.10.9 this app came only inside the Media Stack (modules/media). It is
# its own module now, installed, updated and removed like any other app. A
# box that already runs the Media Stack keeps it — see `conflicts` below.

x-homebox:
  id: radarr
  added_at: "2026-09-18"
  title: "Radarr"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Movie organizer/manager for usenet and torrent users."
  description: "Radarr is a movie collection manager for Usenet and BitTorrent users. It can monitor multiple RSS feeds for new movies and will interface with clients and indexers to grab, sort, and rename them. It can also be configured to automatically upgrade the quality of existing files in the library when a better quality format becomes available."
  source: "https://github.com/Radarr/Radarr"
  docs: "https://radarr.video"
  license: "GPL-3.0"
  icon: "radarr.png"
  category: "media"
  required: false
  default: false
  # Measured on a running box (192.168.1.77, 2026-09-18), idle.
  ram: "~280MB"
  # The same containers under the old all-in-one module. Two copies of the
  # same container name cannot exist, so this one is not offered while that runs.
  conflicts:
    - media
  theme:
    emoji: "🎬"
    color: "#ffc230"
    bg: "#ffc2301f"
  backup:
    # Posters Radarr downloads again by itself, and its logs.
    exclude:
      - radarr/MediaCover
      - radarr/logs
  tips:
    - "In Radarr set the root folder to /data/<Movies>, using the folder name from Settings > Configuration > Media (by default /data/media/movies)."
    - "Add qBittorrent as its download client at http://qbittorrent:8080, and let Prowlarr push the indexers in."
    - "Every one of these apps mounts the pool at the same path (/data), which is what lets downloads become hardlinks instead of copies. Change one mapping and your disk usage quietly doubles."
  env_vars:
    PUID:
      label: "User ID for file ownership"
      type: "text"
      default: "1000"
      config_editable: true
    PGID:
      label: "Group ID for file ownership"
      type: "text"
      default: "1000"
      config_editable: true
  services:
    radarr:
      friendly_name: "Radarr"
      color: "#ffc230"
      description: "Film collection manager"
      icon: "radarr.png"
      port_map: 7878
      reset_login: "arr-config"
      url_scheme: "http"

services:

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls315
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Starts as root, takes ownership of its data directory and drops to its
      # own user. Without these five it either dies on chown or stays root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "7878:7878"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/radarr/config/radarr:/config
      # One mount, for the hardlink reason above.
      - ${HB_MEDIA_ROOT:-${HB_DATA_DIR:-${HB_ROOT:-/opt/podhouse}/data}}:/data
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
