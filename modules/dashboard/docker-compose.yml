# Dashboard — a Podhouse module
#
# The Podhouse dashboard: reads the module tree, installs and controls
# modules, and serves the UI on 8443.

x-homebox:
  id: dashboard
  added_at: "2026-09-05"
  title: "Podhouse Dashboard"
  tagline: "Install apps and see how the box is doing"
  description: "One page for the whole box: install a module with a click, start and stop what is running, watch host CPU, memory and disk, and read any container's logs without opening a shell."
  icon: "homebox.svg"
  category: "core"
  required: true
  default: true
  ram: "~80MB"
  theme:
    emoji: "📦"
    color: "#8b5cf6"
    bg: "rgba(139,92,246,0.12)"
  tips:
    - "It holds a read-write Docker socket because installing an app means creating containers — that is root on this box, so keep it off the internet"
    - "/opt/podhouse is mounted at the same path inside the container so compose bind mounts resolve identically on both sides"
    - "Reachable at http://<box>:8443 even before DNS points a hostname here"
  services:
    dashboard:
      friendly_name: "Podhouse"
      color: "#8b5cf6"
      description: "The dashboard you are looking at"
      icon: "homebox.svg"
      port_map: 8443
      url_scheme: "http"

services:
  dashboard:
    build:
      context: ${HB_ROOT:-/opt/podhouse}/dashboard
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The dashboard runs as root inside the container and reads and writes
      # /opt/podhouse, which belongs to the BOX's user, not to root. Root does
      # not ignore file permissions by itself — that is DAC_OVERRIDE — so
      # without it the dashboard could not read state/auth.json and every box
      # that updated was asked to claim itself again.
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    image: homebox-dashboard:${HB_VERSION:-local}
    container_name: dashboard
    ports:
      - "8443:8443"
    environment:
      - TZ=${TZ:-UTC}
      # Whatever HB_ROOT is, the same path inside — see the volume below.
      - HOMEBOX_ROOT=${HB_ROOT:-/opt/podhouse}
      - PORT=8443
      # Passed in rather than read from .env: the dashboard builds app links
      # from this, and has no other reason to open a file full of secrets.
      - HB_HOST_ADDRESS=${HB_HOST_ADDRESS:-localhost}
      # Set HB_ANONYMOUS_STATS=off in .env to check for updates straight from
      # GitHub and not be counted among running boxes (lib/platform.js).
      - HB_ANONYMOUS_STATS=${HB_ANONYMOUS_STATS:-on}
      # Backups copied to HB_BACKUP_COPY_DIR go through a helper container
      # from in here; the CLI on the host copies directly. See lib/backup.js.
      - HB_BACKUP_COPY_VIA=container
      # Listing containers, reading logs, sampling stats and following events
      # — all of it GET, none of it through the real socket. See
      # lib/docker-endpoint.js.
      - HB_DOCKER_API=dashboard-socket:2375
    volumes:
      # Same path inside and out: `docker compose -f /opt/podhouse/modules/...`
      # run from in here produces bind mounts the host daemon can resolve.
      # Both sides follow HB_ROOT: a fixed path on the right broke the rule the
      # moment a box lived anywhere else.
      - ${HB_ROOT:-/opt/podhouse}:${HB_ROOT:-/opt/podhouse}
      # NOT the Docker socket. Since 0.15.0 this container holds none.
      #
      # Write access to that socket is root on the box: anything that can
      # create a container can create one that bind-mounts / and runs as root.
      # While the web process held it, a session on this page was a session
      # with root, and a stolen cookie was the whole machine.
      #
      # Writes now go to the dashboard-worker service below, over a unix
      # socket in state/, as NAMED operations. Reads go to dashboard-socket, a
      # proxy that answers GET and refuses every write method.
      # The host root, for a real disk figure rather than the image layer's.
      - /:/host/root:ro
      # The whole front end, over the copy baked into the image at build time.
      #
      # This started as an icons-only mount after a `git pull` brought 35 new
      # icons the container could not see. That was the right diagnosis and
      # too narrow a fix: the next `git pull` changed app.css and landed in
      # exactly the same place, because everything under public/ is copied in
      # at build time, not just the icons.
      #
      # So mount the directory, not one folder inside it. A front-end change
      # now needs a `git pull` and a page refresh rather than an image
      # rebuild. Read-only, because nothing in the dashboard writes here —
      # user-uploaded icons go to state/icons and are served from /user-icons.
      #
      # The image still ships its own copy, so a container started without
      # this mount is not broken. HB_ROOT always holds the source here; the
      # dashboard is built from it.
      - ${HB_ROOT:-/opt/podhouse}/dashboard/public:/app/public:ro
      # NOT mounted here: HB_BACKUP_COPY_DIR, the NAS folder backups are copied
      # to. 0.10.6 bound it, which made this container's start depend on the
      # NAS — an automounted share still booting after a power cut could keep
      # the dashboard down. The copy now runs in a throwaway container started
      # for that one job (lib/compose.js, copyArchiveOut).
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'
    healthcheck:
      # /healthz, not a real endpoint: everything else needs a session now, so
      # a probe against /api/metrics gets 401 and the dashboard reports itself
      # unhealthy forever. This one says only that the process answers.
      #
      # A healthcheck HERE overrides the image's HEALTHCHECK entirely, so
      # changing the Dockerfile alone did nothing — the container kept probing
      # the old path through a rebuild, a force-recreate and a docker rm.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  # ------------------------------------------------------------- the worker
  #
  # The half that is allowed to change the box. Same image as the dashboard,
  # different command: it listens on a unix socket in state/ and accepts a
  # fixed list of named operations — install <id>, stop <id>, mount <share> —
  # each of which builds its own command from a validated argument.
  #
  # It has no port and is on no network. The only way to reach it is the
  # socket file, and the only container that has it is the one above.
  dashboard-worker:
    build:
      context: ${HB_ROOT:-/opt/podhouse}/dashboard
    image: homebox-dashboard:${HB_VERSION:-local}
    container_name: dashboard-worker
    command:
      - node
      - worker.js
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The same three the dashboard needs and for the same reason: it runs as
      # root inside the container and reads and writes /opt/podhouse, which
      # belongs to the BOX's user. Root does not ignore file permissions by
      # itself - that is DAC_OVERRIDE.
      #
      # Nothing here is what makes this container powerful. The socket is, and
      # capabilities do not restrain it: the container it asks the daemon to
      # create is created by the daemon, with whatever that container asks for.
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    environment:
      - TZ=${TZ:-UTC}
      - HOMEBOX_ROOT=${HB_ROOT:-/opt/podhouse}
    volumes:
      # Same path inside and out, so the bind mounts in a module file resolve
      # identically whether compose is run from here or from an SSH session.
      - ${HB_ROOT:-/opt/podhouse}:${HB_ROOT:-/opt/podhouse}
      # This is the one container that holds it.
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    # The image's own HEALTHCHECK probes the web server on :8443. This process
    # is not a web server - it listens on a unix socket and nothing else - so
    # inheriting it marks the worker permanently unhealthy, which then shows up
    # on the Overview as a broken app. Off, rather than a health probe invented
    # to satisfy a check.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  # ------------------------------------------------- reads, and only reads
  #
  # haproxy in front of the socket, with every write method refused. The same
  # arrangement the Beszel agent has used since 0.8.1 — see
  # modules/metrics/docker-compose.yml, and docs/DOCKER-SOCKET.md for why a
  # proxy alone was never enough for the dashboard.
  dashboard-socket:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: dashboard-socket
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # haproxy drops to its own user and binds inside the container, and it
      # cannot do either without these.
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    environment:
      # What the page actually reads.
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - EVENTS=1
      - VERSION=1
      - PING=1
      # And nothing that changes anything. POST=0 is the line that matters:
      # with it off, /containers/create is refused whatever else is on.
      - POST=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.50'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
