# Change Detection — a Podhouse module
#
# Watch a page, get told when it moves.

x-homebox:
  id: changedetection
  added_at: "2026-09-09"
  title: "Change Detection"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Best and simplest tool for website change detection, web page monitoring, and website change alerts. Perfect for tracking content changes, price drops, restock alerts, and website defacement monitoring—all for free or enjoy our SaaS plan!"
  description: "Monitor websites for updates — get notified via Discord, Email, Slack, Telegram, Webhook and many more."
  source: "https://github.com/dgtlmoon/changedetection.io"
  docs: "https://changedetection.io"
  license: "Apache-2.0"
  icon: "changedetection.svg"
  category: "productivity"
  required: false
  default: false
  ram: "~600MB"
  theme:
    emoji: "🔍"
    color: "#e91e63"
    bg: "rgba(233,30,99,0.12)"
  tips:
    - "The browser sidecar is what makes it work on modern sites — anything rendered by JavaScript is invisible to a plain fetch"
    - "Select the exact element with the visual picker rather than watching the whole page, or you get an alert every time an ad rotates"
    - "It can notify through Gotify, so a price drop can reach your phone without email"
  env_vars:
    CHANGEDETECTION_URL:
      label: "Public URL"
      type: "text"
  services:
    changedetection:
      friendly_name: "Change Detection"
      color: "#e91e63"
      description: "Website change monitoring"
      icon: "changedetection.svg"
      port_map: 5000
      url_scheme: "http"
      first_login: "No account by default. Set a password under Settings if this box is not only yours."
    changedetection-browser:
      friendly_name: "Detection Browser"
      description: "Headless Chrome for JavaScript pages"
      internal: true

services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.55.8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
    container_name: changedetection
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PLAYWRIGHT_DRIVER_URL=ws://changedetection-browser:3000
      - BASE_URL=${CHANGEDETECTION_URL:-http://${HB_HOST_ADDRESS:-localhost}:5000}
    ports:
      - "5000:5000"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/changedetection/config/datastore:/datastore
    depends_on:
      - changedetection-browser
    networks:
      - homebox_proxy
      - homebox_internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  changedetection-browser:
    # Digest-pinned upstream because this image publishes no version tags.
    # A digest is the only thing here that actually names a build.
    image: dgtlmoon/sockpuppetbrowser:latest@sha256:7116c61ef9cfce3d48a7efd9355d2fbe19f593ea3cfb52a5ded40ecbcb0a3f9d
    security_opt:
      - no-new-privileges:true
    container_name: changedetection-browser
    environment:
      - TZ=${TZ:-UTC}
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=2
    # Chrome needs more than the default 64MB of shared memory or tabs crash
    # in ways that look like the site blocking you.
    shm_size: 2gb
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
      - SYS_ADMIN
    networks:
      - homebox_internal
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
  homebox_internal:
    external: true
