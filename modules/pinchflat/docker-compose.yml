# Pinchflat — a Podhouse module
#
# Keep the YouTube channels you care about, before they go.

x-homebox:
  id: pinchflat
  added_at: "2026-09-09"
  title: "Pinchflat"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Your next YouTube media manager"
  description: "Pinchflat is a self-hosted app for downloading YouTube content built using yt-dlp. It's designed to be lightweight, self-contained, and easy to use. You set up rules for how to download content from YouTube channels or playlists and it'll do the rest, periodically checking for new content. It's perfect for people who want to download content for use in with a media center app (Plex, Jellyfin, Kodi) or for those who want to archive media!"
  source: "https://github.com/kieraneglin/pinchflat"
  license: "AGPL-3.0"
  icon: "pinchflat.png"
  category: "media"
  required: false
  default: false
  ram: "~200MB"
  theme:
    emoji: "⬇️"
    color: "#ff5252"
    bg: "rgba(255,82,82,0.12)"
  tips:
    - "Downloads land in /downloads, which is the pool — set a media profile that writes somewhere your media server already scans"
    - "Start with 'download the last 3 videos' rather than a whole channel: a large back catalogue is hundreds of gigabytes and YouTube notices"
    - "It has no login of its own, so anything that can reach the page can queue downloads"
  services:
    pinchflat:
      friendly_name: "Pinchflat"
      color: "#ff5252"
      description: "YouTube channel archiver"
      icon: "pinchflat.png"
      port_map: 8945
      url_scheme: "http"
      first_login: "No account — it opens straight into the sources list."

services:
  pinchflat:
    image: ghcr.io/kieraneglin/pinchflat:v2025.6.6
    container_name: pinchflat
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "8945:8945"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/pinchflat/config/pinchflat:/config
      - ${HB_MEDIA_ROOT:-${HB_DATA_DIR:-${HB_ROOT:-/opt/podhouse}/data}}:/downloads
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.00'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
