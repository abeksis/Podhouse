# Tdarr — a Podhouse module
#
# Re-encode a library in the background, on a schedule you set.

x-homebox:
  id: tdarr
  added_at: "2026-09-09"
  title: "Tdarr"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Tdarr - Distributed transcode automation using FFmpeg/HandBrake + Audio/Video library analytics + video health checking (Windows, macOS, Linux & Docker)"
  description: "Tdarr V2 is a cross-platform conditional based transcoding application for automating media library transcode/remux management in order to process your media files as required. For example, you can set rules for the required codecs, containers, languages etc that your media should have which helps keeps things organized and can increase compatability with your devices. A common use for Tdarr is to simply convert video files from h264 to h265 (hevc), saving 40%-50% in size."
  source: "https://github.com/HaveAGitGat/Tdarr"
  icon: "tdarr.svg"
  category: "media"
  required: false
  default: false
  ram: "~1GB"
  theme:
    emoji: "🗜️"
    color: "#f79c34"
    bg: "rgba(247,156,52,0.12)"
  tips:
    - "It REPLACES the original file when a job succeeds. Run one library through with a small test folder before pointing it at everything"
    - "Two ports on purpose: 8265 is the page you use, 8266 is the server the workers talk to. Both are published because a worker on another box needs 8266"
    - "The transcode cache is separate from the library and gets large — it is under the module's config directory, on the system disk"
    - "Without a GPU passed in, every transcode is CPU, and a 4K file will occupy every core for a long time"
  services:
    tdarr:
      friendly_name: "Tdarr"
      color: "#f79c34"
      description: "Automated transcoding"
      icon: "tdarr.svg"
      port_map: 8265
      url_scheme: "http"
      first_login: "No login at all by default — anyone who reaches the page can change the rules that rewrite your library."

services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:2.47.01
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Starts as root, takes ownership of its data directory and drops to its
      # own user. Without these five it either dies on chown or stays root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    container_name: tdarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - nodeName=Podhouse
    ports:
      - "8265:8265"
      - "8266:8266"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/tdarr/config/server:/app/server
      - ${HB_ROOT:-/opt/podhouse}/modules/tdarr/config/configs:/app/configs
      - ${HB_ROOT:-/opt/podhouse}/modules/tdarr/config/logs:/app/logs
      # Scratch space for a transcode in progress. On the system disk rather
      # than the pool, so a run in flight does not churn the NAS.
      - ${HB_ROOT:-/opt/podhouse}/modules/tdarr/config/transcode:/temp
      - ${HB_MEDIA_ROOT:-${HB_DATA_DIR:-${HB_ROOT:-/opt/podhouse}/data}}:/media
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
