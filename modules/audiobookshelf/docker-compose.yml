# Audiobookshelf — a Podhouse module
#
# Audiobooks and podcasts, with the position remembered per device.

x-homebox:
  id: audiobookshelf
  added_at: "2026-09-09"
  title: "Audiobookshelf"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Self-hosted audiobook and podcast server"
  description: "Audiobookshelf is a self-hosted audiobook and podcast server."
  source: "https://github.com/advplyr/audiobookshelf"
  docs: "https://audiobookshelf.org"
  license: "GPL-3.0"
  icon: "audiobookshelf.svg"
  category: "media"
  required: false
  default: false
  ram: "~200MB"
  theme:
    emoji: "🎧"
    color: "#82612c"
    bg: "rgba(130,97,44,0.12)"
  tips:
    - "Point a library at /data/books or /data/audiobooks — the pool is mounted whole, so any folder in it works"
    - "One folder per book, named Author/Title, is what its scanner expects; a flat folder of loose files imports badly"
    - "The mobile apps connect straight to this server's address, so it needs to be reachable from wherever you listen"
  services:
    audiobookshelf:
      friendly_name: "Audiobookshelf"
      color: "#82612c"
      description: "Audiobook and podcast server"
      icon: "audiobookshelf.svg"
      port_map: 13378
      container_port: 80
      url_scheme: "http"
      first_login: "Creates the root account on the first visit — pick the password there."

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.35.1
    container_name: audiobookshelf
    environment:
      - TZ=${TZ:-UTC}
      - AUDIOBOOKSHELF_UID=${PUID:-1000}
      - AUDIOBOOKSHELF_GID=${PGID:-1000}
    ports:
      - "13378:80"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/audiobookshelf/config/config:/config
      - ${HB_ROOT:-/opt/podhouse}/modules/audiobookshelf/config/metadata:/metadata
      - ${HB_MEDIA_ROOT:-${HB_DATA_DIR:-${HB_ROOT:-/opt/podhouse}/data}}:/data
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.00'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
