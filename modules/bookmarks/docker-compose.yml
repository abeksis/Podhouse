# Bookmarks — a Podhouse module
#
# Linkding: somewhere to put a link that is not a browser tab.

x-homebox:
  id: bookmarks
  added_at: "2026-09-05"
  title: "Linkding"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Self-hosted bookmark manager that is designed be to be minimal, fast, and easy to set up using Docker."
  description: "linkding is a bookmark manager that you can host yourself. It's designed be to be minimal, fast, and easy to set up using Docker."
  source: "https://github.com/sissbruecker/linkding"
  docs: "https://linkding.link"
  license: "MIT"
  icon: "linkding.svg"
  category: "productivity"
  required: false
  default: false
  ram: "~90MB"
  theme:
    emoji: "🔖"
    color: "#3b82f6"
    bg: "rgba(59,130,246,0.12)"
  tips:
    - "The admin account is created on first start from LINKDING_SUPERUSER_NAME and the generated password — `homebox secrets bookmarks` prints it"
    - "Turn on archiving in Settings and it keeps a readable snapshot of each page, so a dead link is still readable"
  env_vars:
    LINKDING_ADMIN_PASSWORD:
      label: "Admin password"
      type: "secret"
      config_editable: false
  services:
    linkding:
      friendly_name: "Linkding"
      color: "#3b82f6"
      description: "Bookmark manager"
      icon: "linkding.svg"
      port_map: 9090
      url_scheme: "http"
      first_login: "Linkding creates its admin account on first start from the credentials Podhouse generated."

services:
  linkding:
    image: sissbruecker/linkding:1.46.2
    container_name: linkding
    environment:
      - TZ=${TZ:-UTC}
      - LD_SUPERUSER_NAME=admin
      - LD_SUPERUSER_PASSWORD=${LINKDING_ADMIN_PASSWORD:-}
    ports:
      - "9090:9090"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/bookmarks/config/linkding:/etc/linkding/data
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Starts as root, takes ownership of its data directory and drops to its
      # own user. Without these five it either dies on chown or stays root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
