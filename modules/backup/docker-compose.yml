# Backup — a Podhouse module
#
# Duplicati: the copy that lives somewhere else.

x-homebox:
  id: backup
  added_at: "2026-09-09"
  title: "Duplicati"
  # tagline, description, source, docs, license: the project's own, via scripts/upstream-meta.js
  tagline: "Store securely encrypted backups in the cloud!"
  description: "Store securely encrypted backups on cloud storage services! Duplicati is a free, open-source backup client that securely stores encrypted, incremental, and compressed backups on cloud storage services and remote file servers. It supports:"
  source: "https://github.com/duplicati/duplicati"
  icon: "duplicati.svg"
  category: "system"
  required: false
  default: false
  ram: "~300MB"
  theme:
    emoji: "💾"
    color: "#2b5797"
    bg: "rgba(43,87,151,0.12)"
  tips:
    - "A backup nobody has restored from is a hypothesis. Use Restore then pick a single file and bring it back, today, not the day you need it"
    - "Write the encryption passphrase down somewhere off this machine. Without it the backup is a pile of noise, including to you"
    - "3-2-1: three copies, two kinds of media, one off-site. A backup on the same box as the original survives a mistake but not a fire or a theft"
  env_vars:
    DUPLICATI_PASSWORD:
      label: "Web UI password"
      type: "secret"
      config_editable: false
  services:
    backup:
      friendly_name: "Duplicati"
      color: "#2b5797"
      description: "Encrypted off-site backups"
      icon: "duplicati.svg"
      port_map: 8200
      container_port: 8200
      url_scheme: "http"
      first_login: "Signs in with the password Podhouse generated at install — `homebox secrets backup` prints it."

services:
  backup:
    image: linuxserver/duplicati:2.3.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # DAC_OVERRIDE: this container runs as root inside, and the files it
      # reads and writes under /opt/podhouse belong to the BOX's user. Root
      # does not ignore file modes on its own, so without this the app
      # cannot open its own database or config on any box installed the
      # normal way.
      - DAC_OVERRIDE
    container_name: duplicati
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - SETTINGS_ENCRYPTION_KEY=${DUPLICATI_PASSWORD:-}
      - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI_PASSWORD:-}
    ports:
      - "8200:8200"
    volumes:
      - ${HB_ROOT:-/opt/podhouse}/modules/backup/config/duplicati:/config
      # What it can back up. Read-only: a backup tool has no reason to write
      # to the originals, and a misconfigured restore should not be able to.
      - ${HB_MEDIA_ROOT:-${HB_DATA_DIR:-${HB_ROOT:-/opt/podhouse}/data}}:/source/pool:ro
      - ${HB_ROOT:-/opt/podhouse}/modules:/source/module-config:ro
      # Where a restore is written. Separate and writable, so nothing can be
      # restored over a live original by accident.
      - ${HB_ROOT:-/opt/podhouse}/modules/backup/config/restore:/restore
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
